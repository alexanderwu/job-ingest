[project]
name = "job-ingest"
version = "0.1.0"
description = "Ingest jobs from hiringcafe.com"
readme = "README.md"
authors = [
    { name = "Alexander Wu", email = "alexander.wu7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aw",
    "duckdb>=1.5.4",
    "lmstudio>=1.5.0",
    "markdown>=3.10.2",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "streamlit>=1.59.1",
    "typer>=0.27.0",
]

[project.scripts]
job-ingest = "job_ingest.ingest_and_benchmark:main"
job-scrape = "job_ingest.scrape_hiringcafe:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv.sources]
aw = { git = "https://github.com/alexanderwu/aw.git" }

[tool.mypy]
# `just typecheck` runs bare `mypy`, so the targets have to live here.
# Scoped to the package (not all of src/) so stray scratch files don't fail
# the gate.
files = ["src/job_ingest"]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
