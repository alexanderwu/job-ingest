[project]
name = "job-ingest"
version = "0.1.0"
description = "Ingest jobs from hiringcafe.com"
readme = "README.md"
authors = [
    { name = "Alexander Wu", email = "alexander.wu7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aw",
    "duckdb>=1.5.4",
    "lmstudio>=1.5.0",
    "markdown>=3.10.2",
    "msgspec>=0.21.1",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "streamlit>=1.59.1",
    "typer>=0.27.0",
]

[project.scripts]
job-ingest = "job_ingest:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.uv.sources]
aw = { git = "https://github.com/alexanderwu/aw.git" }
