[project]
name = "job-ingest"
version = "0.1.0"
description = "Ingest jobs from hiringcafe.com"
readme = "README.md"
authors = [
    { name = "Alexander Wu", email = "alexander.wu7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
job-ingest = "job_ingest.ingest_and_benchmark:main"
job-scrape = "job_ingest.scrape_hiringcafe:app"
job-dash = "job_ingest.dashboard:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff.lint]
# Ruff's historical default rule set, pinned explicitly. Newer ruff releases
# widen the implicit default, which would otherwise change what `just check`
# enforces on an unrelated dependency bump.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# `just typecheck` runs bare `mypy`, so the targets have to live here.
# Scoped to the package (not all of src/) so stray scratch files don't fail
# the gate.
files = ["src/job_ingest"]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
